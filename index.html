<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mother's Day Shared Memory Wall</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, 'Segoe UI', 'Inter', sans-serif;
            background: linear-gradient(145deg, #fff5f0 0%, #ffe9e4 100%);
            padding: 2rem 1.5rem;
            color: #2e241f;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
        }
        .hero {
            text-align: center;
            margin-bottom: 2rem;
        }
        .hero h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #c25b3a, #e27b58);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .add-card {
            background: rgba(255,255,250,0.95);
            border-radius: 2rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 12px 28px rgba(0,0,0,0.08);
        }
        .form-group {
            margin-bottom: 1rem;
        }
        input, textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 2rem;
            border: 1px solid #fadacf;
            font-size: 1rem;
            background: white;
        }
        button {
            background: #e06e4a;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 2rem;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.8rem;
        }
        .memory-card {
            background: white;
            border-radius: 1.5rem;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            transition: transform 0.2s;
        }
        .memory-card:hover { transform: translateY(-4px); }
        .card-img {
            height: 200px;
            background: #fbeee9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-content {
            padding: 1.2rem;
        }
        .card-title {
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }
        .card-message {
            color: #5d3d2e;
            line-height: 1.4;
            margin: 10px 0;
        }
        .card-date {
            font-size: 0.7rem;
            color: #bf8d74;
            border-top: 1px solid #f3ded4;
            padding-top: 8px;
            display: flex;
            justify-content: space-between;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #d4947a;
            cursor: pointer;
        }
        .status {
            margin-top: 1rem;
            font-size: 0.85rem;
        }
        footer {
            text-align: center;
            margin-top: 2rem;
            color: #c2927b;
        }
        @media (max-width: 680px) {
            body { padding: 1rem; }
            .hero h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="hero">
        <h1>🌷 Mother's Day Memory Wall</h1>
        <p>Every device, every family member – one shared wall of love 💕</p>
    </div>

    <div class="add-card">
        <h2><i class="fas fa-plus-circle"></i> Add a memory</h2>
        <div class="form-group">
            <input type="text" id="title" placeholder="Title (e.g., 'Mom's hug')">
        </div>
        <div class="form-group">
            <textarea id="message" rows="2" placeholder="Write something sweet..."></textarea>
        </div>
        <div class="form-group">
            <input type="file" id="imageFile" accept="image/*">
            <small style="color:#b85633;">📸 Large images will be compressed automatically</small>
        </div>
        <button id="addBtn">❤️ Celebrate Mom</button>
        <div id="statusMsg" class="status"></div>
    </div>

    <div id="memoriesGrid" class="memory-grid">Loading memories...</div>
    <footer>✨ Everyone who opens this page sees the same memories ✨</footer>
</div>

<script>
    // ========== 🔁 REPLACE WITH YOUR SUPABASE CREDENTIALS 🔁 ==========
    const SUPABASE_URL = "https://eacjbmgnhywwjdakrpgv.supabase.co/rest/v1/";     // from project settings
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVhY2pibWduaHl3d2pkYWtycGd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5ODY2MjgsImV4cCI6MjA5NDU2MjYyOH0.NPqY2yI9QUtIlO4ggQS-REmnoynvu3tlR4BjIud2jiM";                   // from project settings
    // =================================================================

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Compress image to base64 (max width 800px, quality 0.7)
    function compressImage(file, maxWidth = 800, quality = 0.7) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    let width = img.width;
                    let height = img.height;
                    if (width > maxWidth) {
                        height = (height * maxWidth) / width;
                        width = maxWidth;
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = reject;
            };
            reader.onerror = reject;
        });
    }

    // Load and display all memories
    async function loadMemories() {
        const { data, error } = await supabase
            .from('memories')
            .select('*')
            .order('created_at', { ascending: false });
        
        const container = document.getElementById('memoriesGrid');
        if (error) {
            container.innerHTML = `<p style="color:red;">⚠️ Error loading: ${error.message}. Check your Supabase URL and anon key.</p>`;
            return;
        }
        if (!data.length) {
            container.innerHTML = `<div style="grid-column:1/-1; text-align:center;">✨ No memories yet — be the first to add one!</div>`;
            return;
        }
        container.innerHTML = data.map(mem => `
            <div class="memory-card" data-id="${mem.id}">
                <div class="card-img">
                    ${mem.image_data ? `<img src="${mem.image_data}" alt="memory">` : `<div style="padding:2rem;">📷</div>`}
                </div>
                <div class="card-content">
                    <div class="card-title">${escapeHtml(mem.title)}</div>
                    <div class="card-message">${escapeHtml(mem.message || '💖')}</div>
                    <div class="card-date">
                        ${new Date(mem.created_at).toLocaleString()}
                        <button class="delete-btn" data-id="${mem.id}">🗑️</button>
                    </div>
                </div>
            </div>
        `).join('');
        // Attach delete events
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const id = btn.getAttribute('data-id');
                if (confirm('Remove this memory?')) {
                    await supabase.from('memories').delete().eq('id', id);
                    loadMemories();
                }
            });
        });
    }

    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
    }

    // Add new memory (with image compression)
    async function addMemory() {
        const title = document.getElementById('title').value.trim();
        const message = document.getElementById('message').value.trim();
        const file = document.getElementById('imageFile').files[0];
        const statusDiv = document.getElementById('statusMsg');
        
        if (!title) {
            statusDiv.innerHTML = '💝 Please enter a title!';
            statusDiv.style.color = '#c25b3a';
            return;
        }
        
        let imageData = null;
        if (file) {
            statusDiv.innerHTML = '📸 Compressing image...';
            try {
                imageData = await compressImage(file);
                statusDiv.innerHTML = '✅ Image ready!';
            } catch(err) {
                statusDiv.innerHTML = '⚠️ Image compression failed, using without photo.';
                imageData = null;
            }
        }
        
        const { error } = await supabase
            .from('memories')
            .insert([{ title, message, image_data: imageData }]);
        
        if (error) {
            statusDiv.innerHTML = `❌ Error: ${error.message}. Double-check your table name and permissions.`;
            statusDiv.style.color = '#c25b3a';
        } else {
            statusDiv.innerHTML = '🎉 Memory added! Refreshing...';
            statusDiv.style.color = '#5fa03e';
            document.getElementById('title').value = '';
            document.getElementById('message').value = '';
            document.getElementById('imageFile').value = '';
            loadMemories();
            setTimeout(() => statusDiv.innerHTML = '', 2500);
        }
    }
    
    document.getElementById('addBtn').addEventListener('click', addMemory);
    loadMemories();
</script>
</body>
</html>
