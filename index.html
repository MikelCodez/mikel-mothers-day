<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mother's Day · Family Memory Wall</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #fff5f0 0%, #ffe9e4 100%);
            color: #2e241f;
            padding: 2rem 1.5rem;
            min-height: 100vh;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
        }
        .family-bar {
            background: #fff0e6;
            border-radius: 60px;
            padding: 0.8rem 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            border: 2px solid #f3c5b0;
        }
        .family-bar strong {
            color: #b44a2a;
        }
        .share-link-box {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            background: white;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
        }
        .share-link-box input {
            border: none;
            background: transparent;
            padding: 8px;
            font-family: monospace;
            font-size: 0.85rem;
            width: 240px;
        }
        .copy-btn, .new-key-btn {
            background: #e27b58;
            border: none;
            padding: 6px 14px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .new-key-btn {
            background: #b57962;
        }
        .hero {
            text-align: center;
            margin-bottom: 2rem;
        }
        .hero h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, #c25b3a, #e27b58);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .add-memory-card {
            background: rgba(255, 255, 250, 0.95);
            border-radius: 42px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 12px 28px rgba(0,0,0,0.08);
        }
        .form-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .form-field {
            flex: 1 1 240px;
        }
        .form-field.full {
            flex: 1 1 100%;
        }
        input, textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 28px;
            border: 1.5px solid #fadacf;
            background: white;
        }
        .btn-add {
            background: linear-gradient(95deg, #e06e4a, #c9502e);
            border: none;
            color: white;
            font-weight: bold;
            padding: 12px 28px;
            border-radius: 40px;
            cursor: pointer;
        }
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.8rem;
        }
        .memory-card {
            background: white;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 12px 20px rgba(0,0,0,0.08);
            transition: transform 0.2s;
        }
        .memory-card:hover {
            transform: translateY(-4px);
        }
        .card-img {
            height: 200px;
            background: #fbeee9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .img-placeholder {
            font-size: 2.5rem;
            color: #e2a085;
        }
        .card-content {
            padding: 1.2rem;
        }
        .card-title {
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }
        .card-message {
            color: #5d3d2e;
            line-height: 1.4;
            margin: 10px 0;
        }
        .card-date {
            font-size: 0.7rem;
            color: #bf8d74;
            border-top: 1px solid #f3ded4;
            padding-top: 8px;
            display: flex;
            justify-content: space-between;
        }
        .delete-memory {
            background: none;
            border: none;
            color: #d4947a;
            cursor: pointer;
        }
        footer {
            margin-top: 3rem;
            text-align: center;
            color: #c2927b;
        }
        @media (max-width: 680px) {
            body { padding: 1rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="family-bar">
        <div><i class="fas fa-users"></i> <strong>Family Memory Wall</strong></div>
        <div class="share-link-box">
            <input type="text" id="shareableLinkInput" readonly>
            <button id="copyLinkBtn" class="copy-btn"><i class="fas fa-copy"></i> Copy link</button>
            <button id="newFamilyKeyBtn" class="new-key-btn"><i class="fas fa-plus"></i> Create new key</button>
        </div>
    </div>

    <div class="hero">
        <h1><i class="fas fa-heart"></i> Mother's Day Garden</h1>
        <p style="margin-top: 8px;">Share the link with family — everyone adds to the same wall!</p>
    </div>

    <div class="add-memory-card">
        <h2><i class="fas fa-plus-circle"></i> Add a memory</h2>
        <div class="form-grid">
            <div class="form-field">
                <label>Title</label>
                <input type="text" id="memoryTitle" placeholder="e.g., 'Mom's hug'">
            </div>
            <div class="form-field full">
                <label>Message</label>
                <textarea id="memoryMessage" rows="2" placeholder="Write something sweet..."></textarea>
            </div>
            <div class="form-field">
                <label>Photo (auto-compressed)</label>
                <input type="file" id="memoryImage" accept="image/*">
                <small id="compressHint" style="color:#b85633;">📸 Images > 1MB will be compressed</small>
            </div>
            <div class="form-field">
                <button class="btn-add" id="addMemoryBtn"><i class="fas fa-save"></i> Celebrate</button>
            </div>
        </div>
        <div id="formStatus" style="margin-top: 12px;"></div>
    </div>

    <div id="memoriesContainer" class="memory-grid"></div>
    <footer><i class="fas fa-heart" style="color:#e06e4a;"></i> Every memory saved with love — share the link!</footer>
</div>

<script>
    // ---------- Image compression (client-side) ----------
    function compressImage(file, maxWidth = 800, quality = 0.8) {
        return new Promise((resolve, reject) => {
            if (!file.type.startsWith('image/')) return reject('Not an image');
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    let width = img.width;
                    let height = img.height;
                    if (width > maxWidth) {
                        height = (height * maxWidth) / width;
                        width = maxWidth;
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = reject;
            };
            reader.onerror = reject;
        });
    }

    // ---------- Family key from URL hash ----------
    function getFamilyKeyFromURL() {
        let hash = window.location.hash.substring(1); // remove #
        if (!hash) {
            // If no hash, check localStorage for last used key, else generate a default
            let lastKey = localStorage.getItem('last_family_key');
            if (lastKey) return lastKey;
            return "MothersDay2025";
        }
        // Save to localStorage so next time they remember
        localStorage.setItem('last_family_key', hash);
        return hash;
    }

    let currentFamilyKey = getFamilyKeyFromURL();
    // Update URL hash if it's not already set or different
    if (window.location.hash !== `#${currentFamilyKey}`) {
        window.location.hash = currentFamilyKey;
    }

    // Storage key
    function getStorageKey(key) {
        return `mothersday_family_${key.replace(/[^a-zA-Z0-9_-]/g, '_')}`;
    }

    // Load memories
    function loadMemories() {
        const stored = localStorage.getItem(getStorageKey(currentFamilyKey));
        if (stored) {
            try {
                const parsed = JSON.parse(stored);
                if (Array.isArray(parsed)) return parsed;
            } catch(e) {}
        }
        return [
            {
                id: Date.now() + "-example1",
                title: "Our First Memory",
                message: "Mom, you're the heart of our family ❤️",
                imageData: null,
                createdAt: new Date().toISOString()
            }
        ];
    }

    let memories = loadMemories();

    function saveMemories() {
        localStorage.setItem(getStorageKey(currentFamilyKey), JSON.stringify(memories));
    }

    function renderMemories() {
        const container = document.getElementById('memoriesContainer');
        if (!container) return;
        if (memories.length === 0) {
            container.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:3rem;">✨ No memories yet — add the first one!</div>`;
            return;
        }
        container.innerHTML = memories.map(mem => {
            const imgHtml = mem.imageData ? `<img src="${mem.imageData}" alt="memory">` : `<div class="img-placeholder"><i class="fas fa-camera"></i><br>📸</div>`;
            const dateStr = mem.createdAt ? new Date(mem.createdAt).toLocaleString() : "Mother's Day";
            return `
                <div class="memory-card" data-id="${mem.id}">
                    <div class="card-img">${imgHtml}</div>
                    <div class="card-content">
                        <div class="card-title">${escapeHtml(mem.title)}</div>
                        <div class="card-message">${escapeHtml(mem.message || "💖")}</div>
                        <div class="card-date">
                            <span>${dateStr}</span>
                            <button class="delete-memory" data-id="${mem.id}"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
        // attach delete events
        document.querySelectorAll('.delete-memory').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = btn.getAttribute('data-id');
                if (id && confirm("Remove this memory?")) {
                    memories = memories.filter(m => m.id !== id);
                    saveMemories();
                    renderMemories();
                    showStatus("✨ Memory removed", "#c25b3a");
                }
            });
        });
    }

    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function showStatus(msg, color = "#b85633") {
        const div = document.getElementById('formStatus');
        div.innerHTML = `<i class="fas fa-heart"></i> ${msg}`;
        div.style.color = color;
        setTimeout(() => { if (div.innerHTML.includes(msg)) div.innerHTML = ""; }, 3000);
    }

    // Add memory with compression
    async function addMemory() {
        const title = document.getElementById('memoryTitle').value.trim();
        const message = document.getElementById('memoryMessage').value.trim();
        const file = document.getElementById('memoryImage').files[0];
        if (!title) {
            showStatus("Please add a title 💝", "#c25b3a");
            return;
        }
        let imageData = null;
        if (file) {
            const sizeMB = file.size / (1024*1024);
            if (sizeMB > 0.5) showStatus(`Compressing image (${sizeMB.toFixed(1)}MB)...`, "#b85633");
            try {
                imageData = await compressImage(file, 800, 0.8);
                showStatus("✅ Image compressed & added!", "#5fa03e");
            } catch(err) {
                showStatus("⚠️ Couldn't compress, using original", "#c25b3a");
                const reader = new FileReader();
                imageData = await new Promise((resolve) => {
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
            }
        }
        const newMem = {
            id: Date.now() + "-" + Math.random().toString(36).substr(2, 6),
            title: title,
            message: message || "Sending love ❤️",
            imageData: imageData,
            createdAt: new Date().toISOString()
        };
        memories.unshift(newMem);
        saveMemories();
        renderMemories();
        document.getElementById('memoryTitle').value = '';
        document.getElementById('memoryMessage').value = '';
        document.getElementById('memoryImage').value = '';
        showStatus(`🎉 "${title}" added to the family wall!`, "#b85633");
    }

    // Update shareable link display
    function updateShareableLink() {
        const linkInput = document.getElementById('shareableLinkInput');
        if (linkInput) {
            let url = window.location.href.split('#')[0];
            linkInput.value = url + '#' + currentFamilyKey;
        }
    }

    // Create a new family key (random)
    function createNewFamilyKey() {
        let newKey = "Mom" + Math.floor(Math.random() * 1000000);
        window.location.hash = newKey;
        currentFamilyKey = newKey;
        localStorage.setItem('last_family_key', currentFamilyKey);
        memories = loadMemories();
        renderMemories();
        updateShareableLink();
        showStatus(`🔑 New family key created! Share this link with family.`, "#5fa03e");
    }

    // Copy link to clipboard
    function copyShareableLink() {
        const linkInput = document.getElementById('shareableLinkInput');
        linkInput.select();
        document.execCommand('copy');
        showStatus("📋 Link copied! Send it to your family.", "#5fa03e");
    }

    // Listen for hash changes (if user clicks a shared link while page open)
    window.addEventListener('hashchange', () => {
        let newKey = window.location.hash.substring(1);
        if (newKey && newKey !== currentFamilyKey) {
            currentFamilyKey = newKey;
            localStorage.setItem('last_family_key', currentFamilyKey);
            memories = loadMemories();
            renderMemories();
            updateShareableLink();
            showStatus(`Switched to family wall: ${currentFamilyKey}`, "#5fa03e");
        }
    });

    // Initialize
    document.getElementById('addMemoryBtn').addEventListener('click', addMemory);
    document.getElementById('copyLinkBtn').addEventListener('click', copyShareableLink);
    document.getElementById('newFamilyKeyBtn').addEventListener('click', createNewFamilyKey);
    updateShareableLink();
    renderMemories();
</script>
</body>
</html>
