<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mother's Day · Family Wall (Shared)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #fff5f0 0%, #ffe9e4 100%);
            padding: 2rem 1.5rem;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
        }
        .hero {
            text-align: center;
            margin-bottom: 2rem;
        }
        .hero h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, #c25b3a, #e27b58);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .add-memory-card {
            background: white;
            border-radius: 32px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 12px 28px rgba(0,0,0,0.08);
        }
        .form-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .form-field {
            flex: 1 1 240px;
        }
        .form-field.full {
            flex: 1 1 100%;
        }
        input, textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 28px;
            border: 1.5px solid #fadacf;
        }
        .btn-add {
            background: #e06e4a;
            border: none;
            color: white;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.8rem;
        }
        .memory-card {
            background: white;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }
        .card-img {
            height: 200px;
            background: #fbeee9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-content {
            padding: 1.2rem;
        }
        .card-title {
            font-weight: 700;
            font-size: 1.2rem;
        }
        .card-message {
            color: #5d3d2e;
            margin: 10px 0;
        }
        .card-date {
            font-size: 0.7rem;
            color: #bf8d74;
            border-top: 1px solid #f3ded4;
            padding-top: 8px;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #d4947a;
            cursor: pointer;
            float: right;
        }
        footer {
            text-align: center;
            margin-top: 2rem;
            color: #c2927b;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="hero">
        <h1><i class="fas fa-heart"></i> Mother's Day Garden</h1>
        <p>✨ Every device in the family sees the same wall — no keys, no copying ✨</p>
    </div>

    <div class="add-memory-card">
        <h2><i class="fas fa-plus-circle"></i> Add a memory</h2>
        <div class="form-grid">
            <div class="form-field">
                <label>Title</label>
                <input type="text" id="title" placeholder="e.g., 'Mom's hug'">
            </div>
            <div class="form-field full">
                <label>Message</label>
                <textarea id="message" rows="2" placeholder="Write something sweet..."></textarea>
            </div>
            <div class="form-field">
                <label>Photo (auto-compressed)</label>
                <input type="file" id="imageFile" accept="image/*">
            </div>
            <div class="form-field">
                <button class="btn-add" id="addBtn"><i class="fas fa-save"></i> Celebrate</button>
            </div>
        </div>
        <div id="statusMsg" style="margin-top:12px;"></div>
    </div>

    <div id="memoriesGrid" class="memory-grid">Loading memories...</div>
    <footer><i class="fas fa-heart"></i> Made with love — shared forever</footer>
</div>

<script>
    // ========== REPLACE WITH YOUR SUPABASE CREDENTIALS ==========
    const SUPABASE_URL = "https://YOUR_PROJECT.supabase.co";     // from Supabase project settings
    const SUPABASE_ANON_KEY = "YOUR_ANON_KEY";                   // from Supabase project settings
    // ============================================================

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Image compression helper
    function compressImage(file, maxWidth = 800, quality = 0.8) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    let width = img.width, height = img.height;
                    if (width > maxWidth) {
                        height = (height * maxWidth) / width;
                        width = maxWidth;
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = reject;
            };
            reader.onerror = reject;
        });
    }

    // Load and display memories
    async function loadMemories() {
        const { data, error } = await supabase
            .from('memories')
            .select('*')
            .order('created_at', { ascending: false });
        
        if (error) {
            console.error(error);
            document.getElementById('memoriesGrid').innerHTML = `<p style="color:red;">Failed to load: ${error.message}</p>`;
            return;
        }
        
        const container = document.getElementById('memoriesGrid');
        if (!data.length) {
            container.innerHTML = `<div style="grid-column:1/-1; text-align:center;">✨ No memories yet — add the first one!</div>`;
            return;
        }
        
        container.innerHTML = data.map(mem => `
            <div class="memory-card">
                <div class="card-img">
                    ${mem.image_data ? `<img src="${mem.image_data}" alt="memory">` : `<div style="padding:2rem;"><i class="fas fa-camera fa-2x"></i></div>`}
                </div>
                <div class="card-content">
                    <div class="card-title">${escapeHtml(mem.title)}</div>
                    <div class="card-message">${escapeHtml(mem.message || '💖')}</div>
                    <div class="card-date">
                        ${new Date(mem.created_at).toLocaleString()}
                        <button class="delete-btn" data-id="${mem.id}"><i class="fas fa-trash-alt"></i></button>
                    </div>
                </div>
            </div>
        `).join('');
        
        // Attach delete handlers
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const id = btn.getAttribute('data-id');
                if (confirm('Remove this memory?')) {
                    await supabase.from('memories').delete().eq('id', id);
                    loadMemories();
                }
            });
        });
    }
    
    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
    }
    
    // Add new memory
    async function addMemory() {
        const title = document.getElementById('title').value.trim();
        const message = document.getElementById('message').value.trim();
        const file = document.getElementById('imageFile').files[0];
        if (!title) {
            document.getElementById('statusMsg').innerHTML = 'Please enter a title 💝';
            return;
        }
        
        let imageData = null;
        if (file) {
            document.getElementById('statusMsg').innerHTML = 'Compressing image...';
            try {
                imageData = await compressImage(file, 800, 0.8);
            } catch(err) {
                document.getElementById('statusMsg').innerHTML = '⚠️ Image error, using without photo';
            }
        }
        
        const { error } = await supabase
            .from('memories')
            .insert([{ title, message, image_data: imageData }]);
        
        if (error) {
            document.getElementById('statusMsg').innerHTML = `Error: ${error.message}`;
        } else {
            document.getElementById('statusMsg').innerHTML = '🎉 Memory added!';
            document.getElementById('title').value = '';
            document.getElementById('message').value = '';
            document.getElementById('imageFile').value = '';
            loadMemories();
            setTimeout(() => document.getElementById('statusMsg').innerHTML = '', 2000);
        }
    }
    
    document.getElementById('addBtn').addEventListener('click', addMemory);
    loadMemories();
</script>
</body>
</html>
