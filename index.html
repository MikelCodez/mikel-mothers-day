<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mother's Day Memory Wall | MikelCodez</title>
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #fff5f0 0%, #ffe9e4 100%);
            color: #2e241f;
            padding: 2rem 1.5rem;
            min-height: 100vh;
        }

        /* custom scroll */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #fbe4db;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #e6a68b;
            border-radius: 10px;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* header area */
        .hero {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }
        .hero h1 {
            font-size: 3.2rem;
            background: linear-gradient(135deg, #c25b3a, #e27b58, #b9472a);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            display: inline-block;
            margin-bottom: 0.6rem;
        }
        .hero h1 i {
            background: none;
            color: #e26b4a;
            font-size: 2.8rem;
            margin-right: 0.3rem;
        }
        .subhead {
            font-size: 1.2rem;
            color: #7c4c38;
            border-top: 2px dashed #f3c5b0;
            border-bottom: 2px dashed #f3c5b0;
            display: inline-block;
            padding: 0.5rem 1.8rem;
            background: rgba(255, 245, 240, 0.7);
            border-radius: 60px;
            backdrop-filter: blur(4px);
            font-weight: 500;
        }
        .quote {
            margin-top: 1rem;
            font-style: italic;
            color: #b96748;
            font-weight: 500;
            font-size: 1rem;
        }

        /* form card */
        .add-memory-card {
            background: rgba(255, 255, 250, 0.9);
            backdrop-filter: blur(2px);
            border-radius: 42px;
            padding: 1.5rem 2rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1);
            margin-bottom: 3rem;
            border: 1px solid rgba(255, 215, 200, 0.8);
            transition: all 0.2s ease;
        }
        .add-memory-card h2 {
            font-size: 1.7rem;
            font-weight: 600;
            color: #b6472a;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .form-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
        }
        .form-field {
            flex: 1 1 240px;
        }
        .form-field.full {
            flex: 1 1 100%;
        }
        label {
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
            color: #633e2c;
            font-size: 0.85rem;
            letter-spacing: 0.3px;
        }
        input, textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 28px;
            border: 1.5px solid #fadacf;
            background: white;
            font-family: 'Inter', monospace;
            transition: 0.2s;
            font-size: 0.95rem;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #e27b58;
            box-shadow: 0 0 0 3px rgba(226, 123, 88, 0.2);
        }
        textarea {
            border-radius: 28px;
            resize: vertical;
        }
        .file-preview-area {
            margin-top: 12px;
            background: #fff0ea;
            border-radius: 32px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        #imagePreview {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 20px;
            background: #ffe2d6;
            border: 2px solid white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }
        .btn-add {
            background: linear-gradient(95deg, #e06e4a, #c9502e);
            border: none;
            color: white;
            font-weight: bold;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 6px 14px rgba(201, 80, 46, 0.3);
        }
        .btn-add:hover {
            background: linear-gradient(95deg, #c95a38, #b44424);
            transform: scale(0.97);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .status-msg {
            margin-top: 12px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #c06748;
        }

        /* memories gallery */
        .memories-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }
        .memories-header h2 {
            font-size: 1.9rem;
            font-weight: 700;
            color: #9b4b31;
        }
        .reset-btn {
            background: #f1dbd2;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            color: #9b4c32;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
        }
        .reset-btn:hover {
            background: #e7c5b8;
            transform: translateY(-2px);
        }
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }
        .memory-card {
            background: white;
            border-radius: 36px;
            overflow: hidden;
            box-shadow: 0 18px 30px -12px rgba(0, 0, 0, 0.12);
            transition: all 0.25s ease;
            border: 1px solid #ffe0d4;
            backdrop-filter: blur(2px);
            display: flex;
            flex-direction: column;
        }
        .memory-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 28px 38px -16px rgba(160, 70, 40, 0.2);
        }
        .card-img {
            width: 100%;
            height: 210px;
            background: #fbeee9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.3s;
        }
        .img-placeholder {
            font-size: 4rem;
            color: #e2a085;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: #fae6de;
            width: 100%;
            height: 100%;
            justify-content: center;
        }
        .card-content {
            padding: 1.3rem 1.5rem 1.5rem;
            flex: 1;
        }
        .card-title {
            font-size: 1.45rem;
            font-weight: 700;
            color: #492e21;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .card-title span {
            background: #fcede9;
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 60px;
            font-weight: 400;
            color: #c46547;
        }
        .card-message {
            color: #5d3d2e;
            line-height: 1.45;
            margin: 12px 0;
            font-size: 0.95rem;
            word-break: break-word;
        }
        .card-date {
            font-size: 0.7rem;
            color: #bf8d74;
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #f3ded4;
            padding-top: 12px;
        }
        .delete-memory {
            background: none;
            border: none;
            color: #d4947a;
            cursor: pointer;
            font-size: 1.2rem;
            transition: 0.2s;
            padding: 6px 8px;
            border-radius: 40px;
        }
        .delete-memory:hover {
            color: #c23b16;
            background: #fbe5db;
            transform: scale(1.05);
        }
        footer {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.8rem;
            color: #c2927b;
            border-top: 1px solid #fadacf;
            padding-top: 1.8rem;
        }
        @media (max-width: 680px) {
            body {
                padding: 1rem;
            }
            .hero h1 {
                font-size: 2.2rem;
            }
            .add-memory-card {
                padding: 1.2rem;
            }
        }
        button {
            cursor: pointer;
        }
        i.fa, i.far, i.fas {
            pointer-events: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="hero">
        <h1><i class="fas fa-heart"></i> Mother's Day · Memory Garden</h1>
        <div class="subhead">for the woman who taught me to code with love & courage</div>
        <div class="quote"><i class="fas fa-feather-alt"></i> Every moment with you blooms forever.</div>
    </div>

    <!-- interactive form: add text boxes + pictures -->
    <div class="add-memory-card">
        <h2><i class="fas fa-plus-circle"></i> Add a new memory</h2>
        <div class="form-grid">
            <div class="form-field">
                <label><i class="far fa-heart"></i> Title *</label>
                <input type="text" id="memoryTitle" placeholder="e.g., 'Sunday Brunch', 'Hugs & Laughs'">
            </div>
            <div class="form-field full">
                <label><i class="fas fa-comment-dots"></i> Message / Text box</label>
                <textarea id="memoryMessage" rows="3" placeholder="Write something sweet, a memory, a thank you note..."></textarea>
            </div>
            <div class="form-field">
                <label><i class="fas fa-camera"></i> Add a picture (optional)</label>
                <input type="file" id="memoryImage" accept="image/jpeg,image/png,image/webp,image/gif">
                <div class="file-preview-area">
                    <img id="imagePreview" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e5aa92'%3E%3Cpath d='M4 4h16v16H4V4zm2 2v12h12V6H6zm2 2h8v8H8V8z'/%3E%3C/svg%3E" alt="preview">
                    <span style="font-size: 13px; color:#b45a3e;"><i class="fas fa-image"></i> preview will appear</span>
                </div>
            </div>
            <div class="form-field" style="display: flex; align-items: flex-end;">
                <button class="btn-add" id="addMemoryBtn"><i class="fas fa-save"></i> Celebrate moment</button>
            </div>
        </div>
        <div id="formStatus" class="status-msg"></div>
    </div>

    <!-- Memory gallery section -->
    <div class="memories-header">
        <h2><i class="fas fa-seedling"></i> Our cherished gallery</h2>
        <button id="resetToExamplesBtn" class="reset-btn"><i class="fas fa-undo-alt"></i> Reset to example memories</button>
    </div>
    <div id="memoriesContainer" class="memory-grid">
        <!-- dynamic cards will appear here -->
    </div>
    <footer>
        <i class="fas fa-code"></i> built with love by MikelCodez · every pixel for mom · <i class="fas fa-heart" style="color:#e06e4a;"></i> 2025
    </footer>
</div>

<script>
    // ---------- STORAGE & DATA ----------
    const STORAGE_KEY = "mothers_day_memories_mikel";

    // Helper: generate unique id
    function generateId() {
        return Date.now() + '-' + Math.random().toString(36).substring(2, 8);
    }

    // format date nicely
    function formatDate(dateObj) {
        if (!dateObj) return "just now";
        const d = new Date(dateObj);
        if (isNaN(d.getTime())) return "recently";
        return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) + 
               " · " + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // Default memories: beautiful examples, including a SVG picture to demonstrate images
    const HEART_SVG_DATA = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23ffe0d4'/%3E%3Cpath fill='%23e25c3a' d='M50 30.5C40 17 22 20 22 36c0 12 10 19 28 32 18-13 28-20 28-32 0-16-18-19-28-5.5z' /%3E%3C/svg%3E";

    function getDefaultMemories() {
        return [
            {
                id: generateId(),
                title: "Endless Love ❤️",
                message: "Thank you for every sacrifice, every warm meal, every hug that healed everything. You are my supermom & hero!",
                imageData: null,
                createdAt: new Date(2025, 4, 5, 14, 32).toISOString()
            },
            {
                id: generateId(),
                title: "Coding & Dreams",
                message: "You believed in my tech journey when I was just a kid with a keyboard. This website is a small flower from your endless encouragement.",
                imageData: null,
                createdAt: new Date(2025, 4, 8, 9, 17).toISOString()
            },
            {
                id: generateId(),
                title: "Blooming Together 🌸",
                message: "From baking cookies to watching me launch my first business idea. Every moment counts, I love you mom!",
                imageData: HEART_SVG_DATA,   // showing image capability
                createdAt: new Date(2025, 4, 9, 20, 45).toISOString()
            }
        ];
    }

    // load memories from localStorage or initialize default
    function loadMemories() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            try {
                const parsed = JSON.parse(stored);
                if (Array.isArray(parsed) && parsed.length) return parsed;
                else return getDefaultMemories();
            } catch(e) {
                return getDefaultMemories();
            }
        } else {
            return getDefaultMemories();
        }
    }

    let memories = loadMemories();

    // save to localStorage
    function persistMemories() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(memories));
    }

    // render memories grid
    function renderMemories() {
        const container = document.getElementById('memoriesContainer');
        if (!container) return;

        if (memories.length === 0) {
            container.innerHTML = `<div style="grid-column:1/-1; text-align:center; background:#fff2ec; border-radius:60px; padding:3rem;"><i class="fas fa-feather-alt fa-2x" style="color:#d98865"></i><p style="margin-top:12px;">No memories yet — start adding beautiful moments above ✨</p></div>`;
            return;
        }

        container.innerHTML = memories.map(mem => {
            const imgSrc = mem.imageData && mem.imageData.trim() !== "" ? mem.imageData : null;
            const imageHtml = imgSrc 
                ? `<img src="${escapeHtml(imgSrc)}" alt="memory snapshot" loading="lazy">` 
                : `<div class="img-placeholder"><i class="fas fa-leaf"></i> <span style="font-size:12px;">picture later</span></div>`;
            const dateStr = mem.createdAt ? formatDate(mem.createdAt) : "Mother's day memory";
            return `
                <div class="memory-card" data-id="${mem.id}">
                    <div class="card-img">
                        ${imageHtml}
                    </div>
                    <div class="card-content">
                        <div class="card-title">
                            ${escapeHtml(mem.title)}
                            <span><i class="far fa-clock"></i> mom's moment</span>
                        </div>
                        <div class="card-message">
                            ${escapeHtml(mem.message) || "💖 no message, but love fills it."}
                        </div>
                        <div class="card-date">
                            <span><i class="far fa-calendar-alt"></i> ${dateStr}</span>
                            <button class="delete-memory" data-id="${mem.id}" title="remove memory"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        // attach delete events after render (event delegation also safe)
        document.querySelectorAll('.delete-memory').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = btn.getAttribute('data-id');
                if (id) {
                    deleteMemoryById(id);
                }
            });
        });
    }

    // simple escape to avoid XSS
    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // delete by id
    function deleteMemoryById(id) {
        memories = memories.filter(m => m.id !== id);
        persistMemories();
        renderMemories();
        showStatusMessage("✨ Memory removed. You can add new ones any time.", "#c48c72");
    }

    // reset to default examples (with confirmation)
    function resetToExamples() {
        if (confirm("Reset will replace all current memories with lovely examples (they also show image support). Your added memories will be lost. Continue?")) {
            memories = getDefaultMemories();
            persistMemories();
            renderMemories();
            showStatusMessage("🌸 Relived lovely examples! now feel free to add your own photos & texts.", "#c36e4a");
        }
    }

    function showStatusMessage(msg, color = "#b35f3e") {
        const statusDiv = document.getElementById('formStatus');
        if (statusDiv) {
            statusDiv.innerHTML = `<i class="fas fa-heart" style="margin-right:6px;"></i> ${msg}`;
            statusDiv.style.color = color;
            setTimeout(() => {
                if (statusDiv.innerHTML.includes(msg)) statusDiv.innerHTML = "";
            }, 3200);
        }
    }

    // add new memory from form (title, message, optional image)
    function addNewMemory() {
        const titleInput = document.getElementById('memoryTitle');
        const messageInput = document.getElementById('memoryMessage');
        const imageFileInput = document.getElementById('memoryImage');
        const title = titleInput.value.trim();
        const message = messageInput.value.trim();

        if (!title) {
            showStatusMessage("💝 Please add a title for this memory, mom will love it!", "#c25b3a");
            return;
        }

        // handle image if any
        let imageData = null;
        const file = imageFileInput.files[0];

        if (file) {
            // file size validation: max 2.5MB
            if (file.size > 2.5 * 1024 * 1024) {
                showStatusMessage("📸 Image is too large (max 2.5MB). Please choose a smaller photo.", "#c25b3a");
                return;
            }
            if (!file.type.startsWith('image/')) {
                showStatusMessage("🖼️ Please select a valid image file (jpg, png, etc).", "#c25b3a");
                return;
            }
            const reader = new FileReader();
            reader.onload = function(ev) {
                imageData = ev.target.result;
                saveMemoryToArray(title, message, imageData);
                resetFormFields(true); // reset after async load
            };
            reader.onerror = function() {
                showStatusMessage("Error reading image, try again.", "#c25b3a");
            };
            reader.readAsDataURL(file);
        } else {
            // no image
            saveMemoryToArray(title, message, null);
            resetFormFields(false);
        }
    }

    function saveMemoryToArray(title, message, imageData) {
        const newMemory = {
            id: generateId(),
            title: title,
            message: message || "💕 no words? smile says it all.",
            imageData: imageData || null,
            createdAt: new Date().toISOString()
        };
        memories.unshift(newMemory); // newest first
        persistMemories();
        renderMemories();
        showStatusMessage(`🎉 "${title}" added to our wall! Mom will adore this.`, "#b85633");
    }

    function resetFormFields(keepImageCleared) {
        document.getElementById('memoryTitle').value = '';
        document.getElementById('memoryMessage').value = '';
        const fileInput = document.getElementById('memoryImage');
        fileInput.value = '';
        // reset preview to default icon
        const previewImg = document.getElementById('imagePreview');
        if (previewImg) {
            previewImg.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e5aa92'%3E%3Cpath d='M4 4h16v16H4V4zm2 2v12h12V6H6zm2 2h8v8H8V8z'/%3E%3C/svg%3E";
        }
    }

    // image preview logic
    function setupImagePreview() {
        const imgInput = document.getElementById('memoryImage');
        const preview = document.getElementById('imagePreview');
        if (imgInput && preview) {
            imgInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file && file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        preview.src = ev.target.result;
                    };
                    reader.readAsDataURL(file);
                } else if (file) {
                    preview.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e5aa92'%3E%3Cpath d='M4 4h16v16H4V4zm2 2v12h12V6H6zm2 2h8v8H8V8z'/%3E%3C/svg%3E";
                } else {
                    preview.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e5aa92'%3E%3Cpath d='M4 4h16v16H4V4zm2 2v12h12V6H6zm2 2h8v8H8V8z'/%3E%3C/svg%3E";
                }
            });
        }
    }

    // event listeners & init
    function initApp() {
        renderMemories();
        setupImagePreview();

        const addBtn = document.getElementById('addMemoryBtn');
        if (addBtn) {
            addBtn.addEventListener('click', addNewMemory);
        }

        const resetBtn = document.getElementById('resetToExamplesBtn');
        if (resetBtn) {
            resetBtn.addEventListener('click', resetToExamples);
        }

        // extra: pressing enter in title doesn't submit but fine
        const titleField = document.getElementById('memoryTitle');
        if (titleField) {
            titleField.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addNewMemory();
                }
            });
        }
    }

    // start
    initApp();
</script>
</body>
</html>
